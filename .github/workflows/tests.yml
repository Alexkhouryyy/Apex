name: Tests

# Runs the same four checks this project runs by hand before every commit:
# the test suite, the boot smoke test, and the two structural audits. Nothing
# here is new logic — it's automating what was, until now, only ever run
# manually and reported after the fact.
on:
  push:
    branches: [main, apex/full-ide-update]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  code-ide:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - name: Install Apex and the locked IDE
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python scripts/setup_code_ide.py --build
      - name: Audit the IDE runtime dependencies
        shell: bash
        run: npm audit --prefix ide --omit=dev --audit-level=moderate
      - name: IDE access, extractor and real process lifecycle
        shell: bash
        env:
          APEX_IDE_INTEGRATION: "1"
        run: python -X utf8 scripts/run_tests.py tests/test_code_ide.py tests/test_code_workspace.py tests/test_code_terminal.py tests/test_code_ide_bundle.py
      - name: Install browser acceptance dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ide-browser" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/ide-browser/node_modules/.bin/playwright" install chromium
      - name: Package and install the Windows IDE bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/code_ide_bundle.py --output "$RUNNER_TEMP/apex-code-ide-windows-node24.zip"
          python scripts/setup_code_ide.py --from-build "$RUNNER_TEMP/apex-code-ide-windows-node24.zip"
      - name: Actual language services, debuggers, extensions and Save All
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/ide-browser/node_modules"
          python scripts/check_code_ide_runtime.py --output-dir "$RUNNER_TEMP/ide-acceptance"
          APEX_DESIGN_ARTIFACTS="$RUNNER_TEMP/ide-acceptance/design" node scripts/check_design_workbench_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-ide-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/ide-acceptance
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: apex-code-ide-windows-node24
          compression-level: 0
          path: |
            ${{ runner.temp }}/apex-code-ide-windows-node24.zip
            ${{ runner.temp }}/apex-code-ide-windows-node24.zip.sha256

  windows-code:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Real Windows terminal and workspace checks without model calls
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-tests-only
        run: python -m pytest -q tests/test_code_terminal.py tests/test_code_workspace.py
      - name: Windows backup handles, sealed snapshots and relay regressions
        run: python -X utf8 scripts/run_tests.py tests/test_backup_brain.py tests/test_relay.py tests/test_relay_check.py tests/test_relay_drain.py tests/test_relay_railway.py tests/test_relay_server.py tests/test_test_runner.py
      - name: Full Windows suite with isolated storage and settings
        run: python -X utf8 scripts/run_tests.py

  mcp-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [requirements.txt, requirements-cloud.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fresh MCP SDK and real stdio round trip
        run: python scripts/check_mcp_sdk.py --requirements ${{ matrix.requirements }} --install

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-research.txt

      - name: Run tests
        env:
          # A placeholder, not a real key. Several tests import main.py
          # directly, and main.py exits at import time if this is empty — no
          # test in the suite makes a real Anthropic API call, so any
          # non-empty string satisfies it.
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-tests-only
        run: python -m pytest -q

      - name: Boot smoke test
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-tests-only
        run: python -m tools.smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Companion, car and spatial DOM checks
        run: |
          npm install --prefix "$RUNNER_TEMP/apex-ui-check" --no-audit --no-fund jsdom@30.0.1
          export NODE_PATH="$RUNNER_TEMP/apex-ui-check/node_modules"
          node --check dashboard/static/app.js
          node scripts/check_budget_ui.cjs
          node --check dashboard/static/companion.js
          node scripts/check_companion_ui.cjs
          node scripts/check_companion_voice_ui.cjs
          node scripts/check_board_readout_ui.cjs
          node scripts/check_drive_spatial_ui.cjs
          node scripts/check_voice_timing_ui.cjs
          node scripts/check_voice_stream_ui.cjs
          node scripts/check_look_now_ui.cjs
          node scripts/check_voice_mode_ui.cjs
          node scripts/check_orb_screen_ui.cjs
          node scripts/check_barge_in_ui.cjs
          node scripts/check_build3d_glb.mjs
          node scripts/check_board_voice_ui.cjs
          node scripts/check_companion_in_board_ui.cjs
          node scripts/check_companion_in_board_ui.cjs --assembly
          node scripts/check_study_projects_ui.cjs
          node scripts/check_study_comfort.cjs
          node scripts/check_study_view.mjs
          node scripts/check_study_holo.mjs
          node scripts/check_theme_ui.cjs
          node scripts/check_study_import.mjs
          node scripts/check_study_gestures.mjs
          node scripts/check_study_motion.mjs
          node scripts/check_study_hands.cjs
          node scripts/check_study_poll.cjs
          node scripts/check_study_mirror.cjs
          node scripts/check_study_picking.mjs
          node scripts/check_study_diagnostics.cjs
          node scripts/check_board_parts_ui.cjs
          node scripts/check_design_workbench_ui.cjs
          node scripts/check_board_hud_ui.cjs
          node scripts/check_daily_workspace_ui.cjs
          node scripts/check_relay_phone_ui.cjs
          node scripts/check_speech_queue.cjs
          node scripts/check_car_link.cjs
          node scripts/check_handsfree_ui.cjs
          node scripts/check_speech_detector_ui.cjs
          node scripts/check_avatar_pose.cjs
          node scripts/check_avatar_ui.cjs
          node scripts/check_video_avatar_ui.cjs
          node scripts/check_video_avatar_sync.cjs
          node scripts/check_live_avatar_ui.cjs
          node scripts/check_work_ui.cjs
          node --check dashboard/static/work.js
          node scripts/check_code_ui.cjs
          node scripts/check_code_flow.cjs
          node scripts/check_code_workspace_ui.cjs
          node scripts/check_code_ide_ui.cjs
          node --check dashboard/static/code_workspace.js
          node --check dashboard/static/code_ide.js
          node --check dashboard/static/code.js
          node scripts/check_code_usage_ui.cjs
          node --check dashboard/static/code_usage.js
          node scripts/check_apps_catalog_ui.cjs
          node --check dashboard/static/apps.js
          node scripts/check_code_narration.cjs
          node --check dashboard/static/code_narration.js
          node scripts/check_reverse_ui.cjs
          node --check dashboard/static/reverse.js
          node --check dashboard/static/live-avatar.js
          node --check dashboard/static/video-avatar.js
          node --check dashboard/static/avatar-pose.js
          node --check dashboard/static/speech-model.js
          node scripts/check_team_ui.cjs
          node --check dashboard/static/scoped-memory.js
          node scripts/check_scoped_memory_ui.cjs
          node --check dashboard/static/world-view.js
          node scripts/check_world_view_ui.cjs
          node scripts/check_world_entry_ui.cjs
          node scripts/check_world_live_ui.cjs
          node --check dashboard/static/world-satellites.js
          node scripts/check_world_satellites_ui.cjs
          node --check dashboard/static/world-flights.js
          node --check dashboard/static/world-layer-status.js
          node scripts/check_world_flights_ui.cjs
          node --check dashboard/static/world-earthquakes.js
          node scripts/check_world_earthquakes_ui.cjs
          node scripts/check_setup_ui.cjs

      - name: Rebuild the bundled editor and verify checked-in assets
        run: |
          npm ci --prefix dashboard/editor --no-audit --no-fund
          npm run build --prefix dashboard/editor
          git diff --exit-code -- dashboard/static/vendor

      - name: Structural audits (informational — never fails the build)
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-tests-only
        run: |
          python -m tools.wiring_audit
          python -m tools.sql_audit
