<!DOCTYPE html>
<!--
  Apex's glass board.

  This page renders the board and offers explicit touch selection. It never runs MediaPipe, never sees a
  landmark, and never opens the camera — it cannot, because Python is holding it
  exclusively. Cursor positions, card positions and the backdrop all arrive over
  one websocket already decided.

  That is the whole architectural difference from a board that tracks in the
  page: closing this tab does not stop Apex seeing your hands, because nothing
  about the tracking lives here. A board that runs MediaPipe in the browser goes
  blind the moment you switch tabs, since browsers pause requestAnimationFrame.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex — Board</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --glass: rgba(18, 22, 30, 0.55);
    --edge:  rgba(150, 190, 255, 0.30);
    --ink:   #e8eefc;
    --accent:#6ea8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05070c; }
  body { font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--ink); }

  /* The backdrop is a still, replaced ~15x a second. An <img> rather than a
     <video> because the frames arrive as individual JPEGs over a websocket —
     there is no stream for a video element to attach to. */
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; filter: saturate(0.75) brightness(0.62);
  }
  #cam.off { display: none; }

  #stage { position: fixed; inset: 0; }
  /* Models sit between the camera and the cards: you can put a note in front
     of an object, which is what makes the two worth having together. */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .card {
    position: absolute; width: 22vw; min-height: 9vh; max-height: 34vh;
    padding: 14px 16px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--edge);
    backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    transform: translate(-50%, -50%);
    /* Only the visual settle is animated. Position is NOT transitioned: a card
       being dragged must track the hand exactly, and easing it would feel like
       lag in the tracking rather than like smoothing. */
    transition: box-shadow .18s ease, border-color .18s ease;
    overflow: hidden;
  }
  .card.held {
    border-color: var(--accent);
    box-shadow: 0 16px 60px rgba(110,168,255,.35);
  }
  .card h3 {
    font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; font-weight: 600;
  }
  .card p { font-size: 14px; opacity: .92; white-space: pre-wrap; word-break: break-word; }

  /* One ring per hand. Filled when pinched, so you can see the grab register
     before you find out whether it caught a card. */
  .ring {
    position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border: 2px solid var(--accent); border-radius: 50%;
    pointer-events: none; transition: background .08s linear, transform .08s linear;
  }
  .ring.pinched { background: rgba(110,168,255,.45); transform: scale(.72); }

  #status {
    position: fixed; left: 16px; bottom: 14px; font-size: 12px;
    letter-spacing: .06em; opacity: .55; text-transform: uppercase;
  }
  #hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    text-align: center; max-width: 34rem; opacity: .8;
  }
  #hint h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
  #hint p { font-size: 14px; opacity: .75; }
  #hint.hidden { display: none; }
  #board-bar {position:fixed;top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5;background:#0b1726e8;padding:12px;border-radius:12px}
  #board-bar button,#board-bar a,#board-bar select {font:inherit;color:var(--ink);background:#17283b;border:1px solid #45617c;border-radius:8px;padding:10px;text-decoration:none}
  #selection-label {flex:1;min-width:160px}
  .card {cursor:pointer;color:var(--ink);font:inherit;text-align:left}
  .card.selected {outline:3px solid #7aebc7}
  .card.model-label {width:auto;min-height:0;max-width:25vw;padding:7px 12px;background:#0a172cdd}
  .card.model-label h3 {margin:0}
  #partner-panel {position:fixed;right:12px;top:88px;bottom:36px;width:min(440px,45vw);z-index:6;background:#08111c;border:1px solid #45617c;border-radius:14px;overflow:hidden}
  #partner-panel iframe {width:100%;height:100%;border:0}
  #diag {position:fixed;right:12px;bottom:56px;z-index:40;width:310px;
         background:rgba(6,14,18,.93);border:1px solid #17313a;border-radius:10px;
         color:#cfe9e2;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
         padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
  #diag[hidden]{display:none}
  .diag-head{display:flex;justify-content:space-between;align-items:center;
             text-transform:uppercase;letter-spacing:.08em;font-size:10px;
             color:#6f9aa4;margin-bottom:8px}
  .diag-head button{background:none;border:0;color:#6f9aa4;font-size:16px;cursor:pointer;line-height:1}
  .diag-hand{border-top:1px solid #14272e;padding-top:7px;margin-top:7px}
  .diag-hand:first-child{border-top:0;padding-top:0;margin-top:0}
  .diag-row{display:flex;justify-content:space-between;gap:10px}
  .diag-k{color:#6f9aa4}
  .diag-bar{position:relative;height:6px;background:#12262d;border-radius:3px;margin:5px 0 6px}
  .diag-fill{position:absolute;inset:0 auto 0 0;background:#2f8f7e;border-radius:3px}
  .diag-mark{position:absolute;top:-3px;width:2px;height:12px;background:#e0b341}
  .diag-release{background:#6f9aa4}
  .diag-yes{color:#5fd0ae}.diag-no{color:#d98b7a}
  .diag-why{margin-top:7px;color:#e6d9a8}
  [hidden] {display:none!important}
  @media(max-width:650px){#partner-panel{width:calc(100vw - 24px);top:140px}.card.model-label{max-width:42vw}#board-bar{font-size:12px}}
</style>
</head>
<body>
<img id="cam" class="off" alt="">
<canvas id="gl"></canvas>
<div id="stage"></div>
<div id="hint">
  <h1>Apex board</h1>
  <p id="hint-body">Connecting…</p>
</div>
<div id="status">—</div>
<!-- The readout. A pinch that does not grab has five causes and they are
     indistinguishable on screen; until now the numbers that decide it existed
     only in a HANDTRACK_DEBUG print. Toggle with D, or ?diag=1. -->
<div id="diag" hidden>
  <div class="diag-head">what the tracker sees <button id="diag-close" aria-label="Hide">×</button></div>
  <div id="diag-body">waiting for a frame…</div>
</div>
<nav id="board-bar"><a href="/">APEX</a><span id="selection-label" role="status">Pinch an object or tap its label to select it.</span><button id="clear-selection">Deselect</button><button id="partner-toggle" aria-expanded="false">Talk to Apex</button><select id="exports" aria-label="Download a manufacturing export"><option value="">Manufacturing exports…</option></select><button id="refresh-exports">Refresh exports</button></nav>
<aside id="partner-panel" hidden><iframe title="Apex workspace partner" data-src="/companion?workspace=board" allow="microphone; display-capture"></iframe></aside>

<script type="module">
"use strict";
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const stage = document.getElementById("stage");
const cam = document.getElementById("cam");
const statusEl = document.getElementById("status");
const hint = document.getElementById("hint");
const hintBody = document.getElementById("hint-body");

// Where the token comes from, in order:
//   1. `?token=` in the URL, for a link you were handed.
//   2. localStorage, written by the main dashboard when you logged in there.
//
// (2) is the one that matters. The first version had only (1), so opening
// /board the obvious way — typing it in the bar — produced a page that
// connected to nothing and sat on "reconnecting…" forever. The board is served
// from the same origin as the dashboard, so it can simply read the credential
// the dashboard already stored under the same key.
const _TOKEN_KEY = "apex_token";
function loadToken() {
  const q = new URLSearchParams(location.search).get("token");
  if (q) {
    // A token that arrived by link is worth keeping, so the next visit needs no
    // link — the same thing logging in to the dashboard does.
    try { localStorage.setItem(_TOKEN_KEY, q); } catch (e) {}
    return q;
  }
  try { return localStorage.getItem(_TOKEN_KEY) || ""; } catch (e) { return ""; }
}
const token = loadToken();
if (new URLSearchParams(location.search).has('token')) history.replaceState(null, '', location.pathname);
let selectedId = null;
async function api(path, options = {}) {
  const response = await fetch(path, {...options, headers: {Authorization: `Bearer ${token}`, ...options.headers}});
  if (!response.ok) throw new Error(response.status === 401 ? 'Log in on the dashboard to continue.' : `Request failed (${response.status}).`);
  return response;
}
async function selectObject(id) {
  try { await api('/api/board/select', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})}); }
  catch (error) { say(error.message); }
}
document.getElementById('clear-selection').onclick = () => selectObject(null);
document.getElementById('partner-toggle').onclick = event => {
  const panel = document.getElementById('partner-panel'); panel.hidden = !panel.hidden;
  event.target.setAttribute('aria-expanded', String(!panel.hidden));
  const frame = panel.querySelector('iframe'); if (!frame.src) frame.src = frame.dataset.src;
};
async function refreshExports() {
  try {
    const data = await (await api('/api/forge/exports')).json();
    const menu = document.getElementById('exports'); menu.replaceChildren(new Option('Manufacturing exports…', ''));
    for (const file of data.files) menu.append(new Option(file, file));
  } catch(error) { say(error.message); }
}
document.getElementById('refresh-exports').onclick = refreshExports;
document.getElementById('exports').onchange = async event => {
  if (!event.target.value) return;
  try {
    const rel = event.target.value;
    const response = await api('/api/forge/download/' + rel.split('/').map(encodeURIComponent).join('/'));
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement('a'); link.href = url; link.download = rel.split('/').pop(); link.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch(error) { say(error.message); }
};

const cards = new Map();   // id -> element
const rings = [];          // one per hand, created lazily

function say(text) { statusEl.textContent = text; }

function renderCards(list) {
  const seen = new Set();
  for (const c of list) {
    seen.add(c.id);
    let el = cards.get(c.id);
    if (!el) {
      el = document.createElement("button");
      el.type = 'button';
      el.className = "card";
      el.onclick = () => selectObject(c.id);
      el.innerHTML = '<h3></h3><p></p>';
      stage.appendChild(el);
      cards.set(c.id, el);
    }
    // Only write when changed. Setting textContent every frame at 15fps forces
    // a needless relayout on every card, and with a dozen up that is visible.
    const h = el.firstElementChild, p = el.lastElementChild;
    if (h.textContent !== c.title) h.textContent = c.title;
    if (p.textContent !== c.body) p.textContent = c.body || "";
    el.style.left = (c.x * 100) + "%";
    el.style.top = (Math.min(.91, c.y + (c.kind === 'model' ? .12 * c.scale : 0)) * 100) + "%";
    el.classList.toggle("held", !!c.held);
    el.classList.toggle('model-label', c.kind === 'model');
    el.classList.toggle('selected', c.id === selectedId);
    el.setAttribute('aria-pressed', String(c.id === selectedId));
  }
  for (const [id, el] of cards) {
    if (!seen.has(id)) { el.remove(); cards.delete(id); }
  }
}

function renderCursors(list) {
  while (rings.length < list.length) {
    const r = document.createElement("div");
    r.className = "ring";
    stage.appendChild(r);
    rings.push(r);
  }
  rings.forEach((r, i) => {
    const c = list[i];
    if (!c) { r.style.display = "none"; return; }
    r.style.display = "block";
    r.style.left = (c.x * 100) + "%";
    r.style.top = (c.y * 100) + "%";
    r.classList.toggle("pinched", !!c.p);
  });
}

// ── 3D ────────────────────────────────────────────────────────────────────
// Models are drawn by three.js on their own canvas; cards stay as DOM, because
// text in WebGL is a font-atlas project and DOM already does it perfectly.
const glCanvas = document.getElementById("gl");
let renderer = null, scene = null, camera3 = null;
const manager = new THREE.LoadingManager();
manager.setURLModifier(url => {
  const target = new URL(url, location.href);
  if (target.protocol === 'data:' || (target.protocol === 'blob:' && target.origin === location.origin)) return url;
  if (target.origin !== location.origin || !target.pathname.startsWith('/board/prop/')) {
    throw new Error('Model dependencies must stay inside the Apex props folder.');
  }
  return target.href;
});
const loader = new GLTFLoader(manager);
loader.setRequestHeader({Authorization: `Bearer ${token}`});
const models = new Map();       // card id -> { group, src }
const pending = new Map();      // id -> src; discard stale loads after edits
let currentModels = new Map();
function dispose(group) {
  group.traverse(obj => { obj.geometry?.dispose();
    for (const material of (Array.isArray(obj.material) ? obj.material : [obj.material])) {
      if (!material) continue;
      for (const value of Object.values(material)) if (value?.isTexture) value.dispose();
      material.dispose();
    }
  });
}

function init3D() {
  try {
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    scene = new THREE.Scene();
    // Orthographic, sized 0..1 in both axes, so a model's position is the SAME
    // window fraction a card's is. A perspective camera would need every
    // coordinate converted and the two layers would drift apart on resize.
    camera3 = new THREE.OrthographicCamera(0, 1, 0, 1, -100, 100);
    camera3.position.z = 10;
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const key = new THREE.DirectionalLight(0xbcd8ff, 2.2);
    key.position.set(1, 2, 3);
    scene.add(key);
    resize3D();
    addEventListener("resize", resize3D);
    return true;
  } catch (e) {
    console.warn("3D unavailable:", e);
    return false;
  }
}

function resize3D() {
  if (!renderer) return;
  renderer.setSize(innerWidth, innerHeight, false);
  // y is flipped so 0 is the TOP, matching how cards are positioned and how
  // the cursor stream arrives from Python. Without this a model tracks your
  // hand upside down while the card next to it does not.
  camera3.left = 0; camera3.right = 1;
  camera3.top = 0; camera3.bottom = 1;
  camera3.updateProjectionMatrix();
}

function fitToUnitBox(obj) {
  // Models arrive at wildly different scales — some are metres, some are
  // millimetres. Normalizing to a fixed on-screen size means a prop is usable
  // the moment it is dropped in the folder, without editing it first.
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const largest = Math.max(size.x, size.y, size.z) || 1;
  obj.position.sub(centre);
  const wrap = new THREE.Group();
  wrap.add(obj);
  wrap.scale.setScalar(0.18 / largest);
  return wrap;
}

function syncModels(cards) {
  currentModels = new Map(cards.map(c => [c.id, c.src]));
  if (!renderer) return;
  const seen = new Set();
  for (const c of cards) {
    if (c.kind !== "model" || !c.src) continue;
    seen.add(c.id);
    let entry = models.get(c.id);
    if (entry && entry.src !== c.src) {
      scene.remove(entry.group); dispose(entry.group); models.delete(c.id); entry = null;
    }
    if (!entry) {
      if (pending.get(c.id) === c.src) continue;
      pending.set(c.id, c.src);
      loader.load("/board/prop/" + c.src.split("/").map(encodeURIComponent).join("/"),
        (gltf) => {
          if (pending.get(c.id) === c.src) pending.delete(c.id);
          if (currentModels.get(c.id) !== c.src) { dispose(gltf.scene); return; }
          const wrap = fitToUnitBox(gltf.scene);
          scene.add(wrap);
          models.set(c.id, { group: wrap, src: c.src, base: wrap.scale.x });
        },
        undefined,
        (err) => {
          // A model that will not load must say so rather than leaving an
          // empty space that looks like the board is broken.
          if (pending.get(c.id) === c.src) pending.delete(c.id);
          console.warn("prop failed to load:", c.src, err);
          say("could not load " + c.src);
        });
      continue;
    }
    const g = entry.group;
    g.position.set(c.x, c.y, 0);
    g.rotation.y = c.rot || 0;
    // `base` is the fit-to-screen factor captured at load. Multiplying by it
    // rather than reading g.scale.x means the user's scale is applied to the
    // ORIGINAL size every frame — reading the current scale would compound it,
    // and the model would grow without bound while being held.
    g.scale.setScalar(entry.base * (c.scale || 1));
  }
  for (const [id, entry] of models) {
    if (!seen.has(id)) { scene.remove(entry.group); dispose(entry.group); models.delete(id); }
  }
}

function draw3D() {
  if (renderer) renderer.render(scene, camera3);
  requestAnimationFrame(draw3D);
}

const has3D = init3D();
if (has3D) draw3D();

let lastFrameAt = 0;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/board?token=${encodeURIComponent(token)}`);

  ws.onopen = () => say("connected");

  const diagEl = document.getElementById("diag");
  // Off by default — it is an instrument, not furniture. On with D, or with
  // ?diag=1 so a link can be handed to someone mid-problem.
  if (new URLSearchParams(location.search).get("diag") === "1") diagEl.hidden = false;
  document.getElementById("diag-close").onclick = () => { diagEl.hidden = true; };
  addEventListener("keydown", ev => {
    if (ev.key !== "d" && ev.key !== "D") return;
    const t = ev.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    diagEl.hidden = !diagEl.hidden;
  });

  // Card titles come from the user and from models, and the panel below
  // builds markup. Everywhere else on this page a title goes in via
  // textContent; here it does not, so it is escaped.
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g,
    ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));

  // --- the readout -----------------------------------------------------
  // Names the FIRST reason a grab is not happening, in the order the board
  // itself checks them, so the line on screen and the code that refused are
  // the same sequence.
  function whyNot(hand, grab) {
    if (!hand) return "no hand in frame";
    if (hand.open_palm) return "open palm — that cancels a grab";
    if (hand.ratio === null) return "hand seen but its shape was unreadable";
    if (!hand.pinched)
      return `not pinched — ratio ${hand.ratio.toFixed(3)} must fall below ${hand.threshold.toFixed(3)} to start`;
    if (!grab) return "pinched";
    if (grab.holding) return `holding ${grab.holding}`;
    if (!grab.nearest) return "pinched, but there is nothing on the board";
    if (!grab.in_reach)
      return `pinched, but ${grab.nearest} is ${grab.distance.toFixed(3)} away and reach is ${grab.reach.toFixed(2)}`;
    if (grab.nearest_is_full) return `${grab.nearest} is already held by two hands`;
    if (grab.state === "armed") return `arming — hold the pinch ${grab.dwell_needed.toFixed(2)}s`;
    return "pinched and in reach";
  }

  function renderDiag(msg) {
    const body = document.getElementById("diag-body");
    if (!msg.tracking) { body.textContent = "hand tracking is off"; return; }
    if (msg.diag_error) { body.textContent = "readout failed: " + msg.diag_error; return; }
    const hands = msg.hands || [], grabs = msg.grabs || [];
    if (!hands.length) { body.textContent = "tracking, but no hands in frame"; return; }
    body.replaceChildren(...hands.map((h, i) => {
      const g = grabs[i];
      const el = document.createElement("div");
      el.className = "diag-hand";
      // The ratio bar: fill is the measured ratio, the marker is the
      // threshold. Pinch is ratio BELOW threshold, so a fill left of the
      // marker means pinched — the one thing worth being able to see at a
      // glance while moving your fingers.
      const pct = h.ratio === null ? 0 : Math.min(100, (h.ratio / 1.2) * 100);
      const mark = Math.min(100, (h.threshold / 1.2) * 100);
      // Second marker: where a HELD pinch lets go. Between the two marks a
      // pinch that has started stays on — that band is the hysteresis, and
      // seeing it explains why 0.74 can read PINCHED.
      const rel = h.release == null ? null : Math.min(100, (h.release / 1.2) * 100);
      el.innerHTML =
        `<div class="diag-row"><span>${esc(h.label)} hand</span>` +
        `<span class="${h.pinched ? "diag-yes" : "diag-no"}">` +
        `${h.pinched ? "PINCHED" : "open"}</span></div>` +
        `<div class="diag-bar"><div class="diag-fill" style="width:${pct.toFixed(1)}%"></div>` +
        `<div class="diag-mark" style="left:${mark.toFixed(1)}%"></div>` +
        (rel === null ? "" :
          `<div class="diag-mark diag-release" style="left:${rel.toFixed(1)}%"></div>`) +
        `</div>` +
        `<div class="diag-row"><span class="diag-k">ratio / threshold</span>` +
        `<span>${h.ratio === null ? "n/a" : h.ratio.toFixed(3)} / ${h.threshold.toFixed(3)}</span></div>` +
        (h.release == null ? "" :
          `<div class="diag-row"><span class="diag-k">held until above</span>` +
          `<span>${h.release.toFixed(3)}</span></div>`) +
        (g ? `<div class="diag-row"><span class="diag-k">nearest</span><span>` +
             `${g.nearest ? esc(g.nearest) : "—"}` +
             `${g.distance === null ? "" : ` @ ${g.distance.toFixed(3)}`}` +
             ` (reach ${g.reach.toFixed(2)})</span></div>` +
             `<div class="diag-row"><span class="diag-k">state</span><span>${esc(g.state)}</span></div>`
           : "") +
        `<div class="diag-why">${esc(whyNot(h, g))}</div>`;
      return el;
    }));
  }

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    // Cards and models are two layers of one board: text stays DOM, geometry
    // goes to WebGL, and both read the same positions from Python.
    selectedId = msg.selection?.id || null;
    document.getElementById('selection-label').textContent = msg.selection ? `Selected: ${msg.selection.title} · whole object` : 'Pinch an object or tap its label to select it.';
    renderCards(msg.cards || []);
    syncModels(msg.cards || []);
    renderCursors(msg.cursors || []);
    if (!diagEl.hidden) renderDiag(msg);

    if (msg.frame) {
      cam.src = "data:image/jpeg;base64," + msg.frame;
      cam.classList.remove("off");
      lastFrameAt = Date.now();
    } else if (Date.now() - lastFrameAt > 2000) {
      cam.classList.add("off");
    }

    // Three states, three different things to do about them — the page should
    // never leave you guessing which.
    const n = (msg.cursors || []).length;
    if (!msg.tracking) {
      say("hand tracking is off");
      hintBody.textContent =
        "Set HANDTRACK_ENABLED=true and BOARD_ENABLED=true, then restart Apex.";
      hint.classList.toggle("hidden", (msg.cards || []).length > 0);
    } else if (n === 0) {
      say("tracking — no hands in frame");
      hintBody.textContent = "Hold a hand up in front of the camera.";
      hint.classList.toggle("hidden", (msg.cards || []).length > 0);
    } else {
      say(`${n} hand${n > 1 ? "s" : ""} · ${(msg.cards || []).length} card${(msg.cards || []).length === 1 ? "" : "s"}`);
      hint.classList.add("hidden");
    }
  };

  // Reconnect rather than dying. Apex restarts more often than this page does,
  // and a board that needs a manual refresh after every restart is a board
  // nobody leaves open.
  //
  // With one exception, and it is the whole reason this branch exists: 1008 is
  // the code the socket closes with when the token is wrong or missing. Retrying
  // that forever renders as "reconnecting…", which is exactly what a stopped
  // Apex looks like — so a credential problem would be indistinguishable from a
  // dead process, and no amount of waiting would ever fix it. Say which one it
  // is, and stop.
  ws.onclose = (ev) => {
    if (ev && ev.code === 1008) {
      say("not authorized");
      hintBody.textContent = token
        ? "That token was refused. Log in on the dashboard at / and reopen this page."
        : "No dashboard token found. Log in at / first, or open /board?token=YOUR_TOKEN.";
      hint.classList.remove("hidden");
      return;
    }
    say("reconnecting…");
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

connect();
refreshExports();
</script>
</body>
</html>
